<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reese: Demon Hunter</title>
    <!-- iOS Full Screen Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Demon Hunter">
    <link rel="apple-touch-icon" href="images/reese-headon.png">
    <!-- Android Full Screen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" type="image/png" href="images/reese-headon.png">
    <!-- Google Font - stylized K-pop look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&display=swap" rel="stylesheet">
    <style>
        /* Custom K-pop font - download from dafont and place in fonts folder if desired */
        @font-face {
            font-family: 'KpopHunters';
            src: url('fonts/HuntersKPop.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: url('images/kpop-background.jpg') center center / cover no-repeat;
            background-color: #1a1a2e;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
        }

        #start-screen h1 {
            color: #ff6b9d;
            font-size: 3rem;
            text-align: center;
            text-shadow: 0 0 20px #ff6b9d, 0 0 40px #c44569;
            margin-bottom: 20px;
        }

        #start-screen .hero-image {
            max-width: 300px;
            max-height: 40vh;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
            margin-bottom: 30px;
        }

        #start-button {
            padding: 20px 60px;
            font-size: 2rem;
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(196, 69, 105, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        #start-button:hover,
        #start-button:active {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(196, 69, 105, 0.6);
        }

        /* Game Screen (hidden initially) */
        #game-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        /* HUD Container */
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 50;
        }

        /* Timer Display */
        #timer-display {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Bangers', sans-serif;
            text-shadow: 0 0 10px #00bcd4, 0 0 20px #0097a7;
            min-width: 80px;
        }

        #timer-display.warning {
            color: #ff5722;
            text-shadow: 0 0 10px #ff5722, 0 0 20px #e64a19;
            animation: timerPulse 0.5s ease-in-out infinite;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Score Display */
        #score-display {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ff6b9d, 0 0 20px #c44569;
            transition: transform 0.2s;
        }

        #score-display.pop {
            animation: scorePop 0.3s ease-out;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ffeb3b; }
            100% { transform: scale(1); }
        }

        /* Hero Action Shot */
        #hero-action {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-height: 35vh;
            max-width: 250px;
            z-index: 10;
            filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.8));
            transition: left 0.25s ease-out, bottom 0.25s ease-out, transform 0.25s ease-out;
        }

        #hero-action.idle {
            animation: heroIdle 2s ease-in-out infinite;
        }

        #hero-action.attacking {
            animation: heroAttack 0.3s ease-out;
        }

        @keyframes heroIdle {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        @keyframes heroAttack {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); filter: drop-shadow(0 0 40px rgba(255, 235, 59, 1)); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* Demon Sprites */
        .demon {
            position: absolute;
            width: 100px;
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            -webkit-tap-highlight-color: transparent;
            animation: demonSpawn 0.5s ease-out forwards;
            opacity: 0;
            transform: scale(0);
        }

        .demon:active {
            transform: scale(0.9);
        }

        .demon.defeated {
            animation: demonDefeat 0.4s ease-out forwards;
            pointer-events: none;
        }

        @keyframes demonSpawn {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            70% { transform: scale(1.2) rotate(10deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes demonDefeat {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; filter: brightness(3); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Hit sparkle effect */
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffeb3b 0%, #ff9800 50%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 0.6s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* Win Screen (hidden initially) */
        #win-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            background: rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        #win-screen.visible {
            opacity: 1;
        }

        #win-screen h1 {
            font-family: 'KpopHunters', 'Bangers', 'Bebas Neue', sans-serif;
            font-size: 3rem;
            color: #ffeb3b;
            text-align: center;
            text-shadow: 0 0 20px #ffeb3b, 0 0 40px #ff9800, 0 0 60px #ff5722;
            margin-bottom: 20px;
            padding: 0 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        #win-screen p {
            font-family: 'Bangers', 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: #ff6b9d;
            text-align: center;
            text-shadow: 0 0 10px #ff6b9d;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        #win-screen .hero-image {
            max-width: 250px;
            max-height: 30vh;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 235, 59, 0.6);
            margin-bottom: 30px;
        }

        #play-again-button {
            padding: 20px 50px;
            font-size: 1.8rem;
            font-family: 'Bangers', sans-serif;
            background: linear-gradient(45deg, #ffeb3b, #ff9800);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 152, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        #play-again-button:hover,
        #play-again-button:active {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 152, 0, 0.7);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Reese: Demon Hunter</h1>
        <img src="images/reese-headon.png" alt="Reese the Demon Hunter" class="hero-image">
        <button id="start-button">PLAY!</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div id="hud">
            <div id="timer-display">60s</div>
            <div id="score-display">Demons: 0 / 10</div>
        </div>
        <div id="demon-container"></div>
        <img id="hero-action" src="images/reese-action.png" alt="Reese attacking">
    </div>

    <!-- Win Screen -->
    <div id="win-screen">
        <h1>You defeated all the demons!</h1>
        <p>Happy Birthday, Reese!</p>
        <img src="images/reese-headon.png" alt="Reese the Champion" class="hero-image">
        <button id="play-again-button">PLAY AGAIN!</button>
    </div>

    <!-- Background Music -->
    <audio id="background-music">
        <source src="golden.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Game State
        const gameState = {
            score: 0,
            demonsDefeated: 0,
            totalDemons: 10,
            timeRemaining: 60,
            timerInterval: null,
            demonMoveInterval: null
        };

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const winScreen = document.getElementById('win-screen');
        const startButton = document.getElementById('start-button');
        const demonContainer = document.getElementById('demon-container');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const heroAction = document.getElementById('hero-action');
        const backgroundMusic = document.getElementById('background-music');

        // Demon images
        const demonImages = [
            'images/demon1.png',
            'images/demon2.png',
            'images/demon3.png',
            'images/demon4.png'
        ];

        // Request fullscreen (skip on iOS - use Add to Home Screen instead)
        function requestFullscreen() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) return; // iOS uses Add to Home Screen for fullscreen

            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen();
            }
        }

        // Start music (only if not already playing)
        function startMusic() {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
            }
        }

        // Stop music
        function stopMusic() {
            backgroundMusic.pause();
        }

        // Pause/resume music when app is minimized or tab hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                backgroundMusic.pause();
            }
        });

        // Spawn demons at random positions
        function spawnDemons() {
            demonContainer.innerHTML = '';

            // Reset hero position
            heroAction.style.left = '50%';
            heroAction.style.bottom = '20px';
            heroAction.classList.add('idle');

            for (let i = 0; i < gameState.totalDemons; i++) {
                const demon = document.createElement('div');
                demon.className = 'demon';
                demon.dataset.id = i;

                // Random demon image
                const randomDemon = demonImages[Math.floor(Math.random() * demonImages.length)];
                demon.style.backgroundImage = `url('${randomDemon}')`;

                // Random position (avoid edges and bottom where hero is)
                const maxX = window.innerWidth - 120;
                const maxY = window.innerHeight - 250; // Leave room for hero
                const minY = 80; // Leave room for score

                const randomX = Math.random() * maxX + 10;
                const randomY = Math.random() * (maxY - minY) + minY;

                demon.style.left = randomX + 'px';
                demon.style.top = randomY + 'px';

                // Random velocity for movement (speed between 1-3)
                const speed = 1 + Math.random() * 2;
                const angle = Math.random() * Math.PI * 2;
                demon.dataset.vx = Math.cos(angle) * speed;
                demon.dataset.vy = Math.sin(angle) * speed;

                // Staggered spawn animation
                demon.style.animationDelay = `${i * 0.1}s`;

                // Add click/tap handler to defeat demon
                demon.addEventListener('click', () => defeatDemon(demon));

                demonContainer.appendChild(demon);
            }

            // Start demon movement
            startDemonMovement();
        }

        // Move demons around the screen
        function startDemonMovement() {
            // Stop any existing movement
            stopDemonMovement();

            gameState.demonMoveInterval = setInterval(() => {
                const demons = document.querySelectorAll('.demon:not(.defeated)');
                const maxX = window.innerWidth - 100;
                const maxY = window.innerHeight - 250;
                const minX = 10;
                const minY = 80;

                demons.forEach(demon => {
                    let x = parseFloat(demon.style.left);
                    let y = parseFloat(demon.style.top);
                    let vx = parseFloat(demon.dataset.vx);
                    let vy = parseFloat(demon.dataset.vy);

                    // Update position
                    x += vx;
                    y += vy;

                    // Bounce off edges
                    if (x <= minX || x >= maxX) {
                        vx = -vx;
                        x = Math.max(minX, Math.min(maxX, x));
                    }
                    if (y <= minY || y >= maxY) {
                        vy = -vy;
                        y = Math.max(minY, Math.min(maxY, y));
                    }

                    // Save new values
                    demon.style.left = x + 'px';
                    demon.style.top = y + 'px';
                    demon.dataset.vx = vx;
                    demon.dataset.vy = vy;
                });
            }, 30); // ~33fps for smooth movement
        }

        function stopDemonMovement() {
            if (gameState.demonMoveInterval) {
                clearInterval(gameState.demonMoveInterval);
                gameState.demonMoveInterval = null;
            }
        }

        // Create sparkle particles
        function createSparkles(x, y) {
            const colors = ['#ffeb3b', '#ff9800', '#ff6b9d', '#e91e63', '#9c27b0'];
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';

                // Random offset from center
                const offsetX = (Math.random() - 0.5) * 100;
                const offsetY = (Math.random() - 0.5) * 100;

                sparkle.style.left = (x + offsetX) + 'px';
                sparkle.style.top = (y + offsetY) + 'px';
                sparkle.style.background = `radial-gradient(circle, ${colors[Math.floor(Math.random() * colors.length)]} 0%, transparent 70%)`;

                demonContainer.appendChild(sparkle);

                // Remove sparkle after animation
                setTimeout(() => sparkle.remove(), 600);
            }
        }

        // Move hero to attack position
        function moveHeroTo(targetX, targetY) {
            // Stop idle animation
            heroAction.classList.remove('idle');

            // Calculate position (center hero on target)
            const heroHeight = heroAction.offsetHeight;
            const bottomPos = window.innerHeight - targetY - heroHeight / 2;

            heroAction.style.left = targetX + 'px';
            heroAction.style.bottom = Math.max(20, bottomPos) + 'px';

            // Add attack animation
            heroAction.classList.add('attacking');
            setTimeout(() => {
                heroAction.classList.remove('attacking');
            }, 300);
        }

        // Return hero to center
        function returnHeroToCenter() {
            heroAction.style.left = '50%';
            heroAction.style.bottom = '20px';
            setTimeout(() => {
                heroAction.classList.add('idle');
            }, 250);
        }

        // Defeat a demon when clicked
        function defeatDemon(demon) {
            // Prevent double-clicks
            if (demon.classList.contains('defeated')) return;

            // Get position for sparkles and hero movement
            const rect = demon.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Move hero to demon
            moveHeroTo(centerX, centerY);

            // Add defeat animation
            demon.classList.add('defeated');

            // Create sparkle particles
            createSparkles(centerX, centerY);

            // Update score
            gameState.demonsDefeated++;
            updateScore();

            // Remove after animation completes
            setTimeout(() => {
                demon.remove();

                // Check for win
                if (gameState.demonsDefeated >= gameState.totalDemons) {
                    setTimeout(showWinScreen, 300);
                } else {
                    // Return hero to center after short delay
                    setTimeout(returnHeroToCenter, 100);
                }
            }, 400);
        }

        // Update score display
        function updateScore() {
            scoreDisplay.textContent = `Demons: ${gameState.demonsDefeated} / ${gameState.totalDemons}`;

            // Pop animation
            scoreDisplay.classList.remove('pop');
            // Force reflow to restart animation
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('pop');
        }

        // Timer functions
        function startTimer() {
            gameState.timeRemaining = 60;
            updateTimerDisplay();
            timerDisplay.classList.remove('warning');

            gameState.timerInterval = setInterval(() => {
                gameState.timeRemaining--;
                updateTimerDisplay();

                // Warning when 10 seconds left
                if (gameState.timeRemaining <= 10) {
                    timerDisplay.classList.add('warning');
                }

                // Time's up!
                if (gameState.timeRemaining <= 0) {
                    stopTimer();
                    handleTimeUp();
                }
            }, 1000);
        }

        function stopTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = `${gameState.timeRemaining}s`;
        }

        function handleTimeUp() {
            // For now, just show win screen - you can customize this later!
            showWinScreen();
        }

        // Start Game
        startButton.addEventListener('click', startGame);

        function startGame() {
            // Request fullscreen (works on desktop, ignored if not supported)
            requestFullscreen();

            // Reset game state
            gameState.demonsDefeated = 0;
            updateScore();

            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';

            // Start the music
            startMusic();

            // Start the timer
            startTimer();

            // Spawn the demons
            spawnDemons();

            console.log('Game started!');
        }

        function showWinScreen() {
            // Stop the timer and demon movement
            stopTimer();
            stopDemonMovement();

            gameScreen.style.display = 'none';
            winScreen.style.display = 'flex';
            // Trigger fade-in
            setTimeout(() => {
                winScreen.classList.add('visible');
            }, 50);
        }

        // Play Again button
        const playAgainButton = document.getElementById('play-again-button');
        playAgainButton.addEventListener('click', playAgain);

        function playAgain() {
            winScreen.classList.remove('visible');
            winScreen.style.display = 'none';
            startGame();
        }
    </script>
</body>
</html>
