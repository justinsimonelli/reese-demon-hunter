<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reese: Demon Hunter</title>
    <!-- iOS Full Screen Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reese: Demon Hunter">
    <link rel="apple-touch-icon" href="images/reese-headon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/reese-headon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="images/reese-headon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="images/reese-headon.png">
    <!-- Android Full Screen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" type="image/png" href="images/reese-headon.png">
    <!-- Google Font - stylized K-pop look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Reese: Demon Hunter</h1>
        <img src="images/reese-headon.png" alt="Reese the Demon Hunter" class="hero-image">
        <button id="start-button">PLAY!</button>
    </div>

    <!-- Mode Selection Screen -->
    <div id="mode-screen">
        <h2>Choose Your Mode!</h2>
        <div class="mode-buttons">
            <button id="demon-mode-btn" class="mode-btn">
                DEMON HUNTER
                <div class="mode-description">Tap all the demons!</div>
            </button>
            <button id="dance-mode-btn" class="mode-btn">
                DANCE BATTLE
                <div class="mode-description">Dance to the beat!</div>
            </button>
            <button id="soda-mode-btn" class="mode-btn">
                SODA POP!
                <div class="mode-description">Pop the bubbles!</div>
            </button>
            <button id="runner-mode-btn" class="mode-btn">
                DEMON DASH!
                <div class="mode-description">Run and jump!</div>
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <button id="back-button">&#10005;</button>
        <div id="hud">
            <div id="timer-display">60s</div>
            <div id="score-display">Demons: 0 / 10</div>
        </div>
        <div id="dance-combo"></div>
        <div id="demon-container"></div>
        <img id="hero-action" src="images/reese-action.png" alt="Reese attacking">
    </div>

    <!-- Win Screen -->
    <div id="win-screen">
        <h1>You defeated all the demons!</h1>
        <p id="win-message"></p>
        <img src="images/reese-headon.png" alt="Reese the Champion" class="hero-image">
        <div class="win-buttons">
            <button id="play-again-button">PLAY AGAIN!</button>
            <button id="harder-button">HARD MODE!</button>
            <button id="home-button">NEW GAME</button>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="background-music">
        <source src="golden.mp3" type="audio/mpeg">
    </audio>
    <audio id="dance-music">
        <source src="how_its_done.mp3" type="audio/mpeg">
    </audio>
    <audio id="soda-music">
        <source src="soda_pop.mp3" type="audio/mpeg">
    </audio>
    <audio id="runner-music">
        <source src="takedown.mp3" type="audio/mpeg">
    </audio>

    <!-- External JavaScript -->
    <script src="game.js"></script>
</body>
</html>
